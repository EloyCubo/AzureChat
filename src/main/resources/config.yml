# LPC Configuration
# https://luckperms.net/wiki/Prefixes,-Suffixes-&-Meta
#
# Placeholders:
# {message} - the chat message
# {name} - the player's name
# {displayname} - the player's display name / nickname (falls back to {name} on Velocity)
# {world} - the backend server the player is currently on (Velocity has no concept of worlds)
# {prefix} - the player's highest priority prefix
# {suffix} - the player's highest priority suffix
# {prefixes} - the player's prefixes sorted by the highest priority
# {suffixes} - the player's suffixes sorted by the highest priority
# {username-color} - the player's or the group's username color (LuckPerms meta key "username-color")
# {message-color} - the player's or the group's message color (LuckPerms meta key "message-color")
#
# /msg placeholders:
# {sender} - sender username
# {sender-displayname} - sender display name (Velocity currently falls back to username)
# {receiver} - receiver username
# {receiver-displayname} - receiver display name (Velocity currently falls back to username)
# {message} - private message content
#
# Mute placeholders (used in "mute.denied-message-with-reason"):
# {reason} - the reason for the mute, as set by staff via AzureStaff
# {staff} - the staff member who applied the mute
# {expires} - formatted expiry date/time, or the "permanent-label" if it never expires
#
# Color codes: Use & for colors (&a, &b, etc.) and &#rrggbb for hex colors.
# Permissions: lpc.reload, lpc.clearchat, lpc.debug, lpc.colorcodes, lpc.rgbcodes, azurechat.msgspy
#
# Commands:
#   /lpc reload - Reload configuration
#   /lpc clear - Clear chat for all players
#   /lpc debug <player> - Show resolved prefix/suffix info for a player
#   /msg <player> <message> - Send a private message to a player on your current server
#   /msgspy (alias /socialspy) - Toggle seeing all /msg traffic (requires azurechat.msgspy)
#
# More information: https://www.spigotmc.org/resources/68965

# If true (recommended), chat messages are only broadcast to players on the
# SAME backend server as the sender. If false, chat is broadcast to the whole proxy.
# /msg is also enabled only when this is true.
per-server-chat: true

# How long to wait (ms) for a backend Paper server to resolve PlaceholderAPI
# requests before falling back to the original text. Adjust as needed.
placeholder-timeout-ms: 2000

# Optional per-server chat format support.
# "default" applies to any server not explicitly listed under "servers".
# If a server-specific format is missing, it falls back to the default node.
server-chat-formats:
  default:
    chat-format: "{prefix}{name}&r: {message}"
    # group-formats:
    #   default: "{prefix}{name}&r: {message}"
    #   admin: "&c[Admin] {prefix}{name}&r: {message}"
  servers:
    lobby:
      chat-format: "[Lobby] {prefix}{name}&r: {message}"
      # group-formats:
      #   default: "{prefix}{name}&r: {message}"
      #   admin: "&c[Admin] {prefix}{name}&r: {message}"

# Private messages.
# This section is active only when per-server-chat is true.
msg:
  usage: "&cUsage: /msg <player> <message>"
  disabled-message: "&cno deberias estar viendo este mensaje porque no se usa en el codigo :)"
  no-server-message: "&cYou must be connected to a server to use /msg."
  player-not-found-message: "&cThat player could not be found."
  not-on-server-message: "&cThat player is not on your current server."

  # Message shown to the sender.
  format-sender: "&d[MSG] &fYou &7-> &f{receiver}&7: &r{message}"

  # Message shown to the receiver.
  format-receiver: "&d[MSG] &f{sender} &7-> &fYou&7: &r{message}"

  # Message shown to staff who have /msgspy enabled, whenever any /msg is sent.
  # Uses {sender}, {sender-displayname}, {receiver}, {receiver-displayname}, {message}
  format-admin: "&8[&cSpy&8] &7{sender} &8-> &7{receiver}&8: &f{message}"

  # Messages related to the /msgspy (alias /socialspy) command.
  spy:
    enabled-message: "&aMessage spy enabled. You will now see all private messages."
    disabled-message: "&cMessage spy disabled."
    no-permission-message: "&cYou do not have permission to use this command."

  # Velocity can play the Minecraft sound directly for the receiving player,
  # so no Paper-side companion/plugin-message is required for the sound.
  sound:
    enabled: true
    sound: "minecraft:block.note_block.pling"
    volume: 1.0
    pitch: 1.0

# Messages shown to a player when their chat message is blocked because they
# are muted (checked live against AzureStaff). {reason}, {staff} and {expires}
# are only available in "denied-message-with-reason" (used when AzureStaff can
# report mute details; otherwise the plain "denied-message" is used).
mute:
  denied-message: "&cNo puedes hablar en el chat mientras estés muteado."
  denied-message-with-reason: "&cEstás muteado por: &f{reason}&c. Muteado por: &f{staff}&c. Expira: &f{expires}"
  permanent-label: "Nunca (permanente)"

# Delay for join messages in milliseconds. This helps the joining player
# see the message that other players receive when they connect.
join-message-delay-ms: 500

# Message shown after /lpc clear
clear-chat-message: "&7Chat has been cleared by a staff member."

# Join / Leave messages, sent only to players on the specific backend server
# (not proxy-wide). Uses the same placeholders as chat-format above
# ({message} is not available here since there's no chat message involved).
#
# "default" applies to any server not explicitly listed under "servers".
# Add one entry per server name (must match your velocity.toml server names)
# under "servers" to override join-enabled/leave-enabled/messages for it.
server-messages:
  default:
    join-enabled: false
    leave-enabled: false
    join-message: "&a{name} has joined the server."
    leave-message: "&c{name} has left the server."
  servers:
    lobby:
      join-enabled: true
      leave-enabled: true
      join-message: "&a{name} has joined the server."
      leave-message: "&c{name} has left the server."
#    survival:
#      join-enabled: true
#      leave-enabled: true
#      join-message: "&a{prefix}{name} &ahas joined Survival!"
#      leave-message: "&c{prefix}{name} &chas left Survival."
